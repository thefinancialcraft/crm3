name: crm3
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- UI / WebView ---
  flutter_inappwebview: ^6.1.5
  flutter_svg: ^2.0.10
  flutter_overlay_window: ^0.5.0

  # --- Permissions ---
  permission_handler: ^11.3.1

  # --- Call Handling ---
  phone_state: ^3.0.1
  call_log: ^6.0.1

  # --- Background & Notifications ---
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^18.0.1

  # --- Device Info ---
  device_info_plus: ^11.1.2
  package_info_plus: ^8.1.2

  # --- Storage ---
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.2
  path: ^1.9.1

  # --- Backend ---
  supabase_flutter: ^2.10.3
  http: ^1.2.1

  # --- State Management ---
  provider: ^6.1.2

  # --- Utilities ---
  logger: ^2.4.0
  flutter_dotenv: ^5.1.0
  url_launcher: ^6.3.2
  share_plus: ^10.1.2
  connectivity_plus: ^6.0.3
  intl: ^0.19.0
  crypto: ^3.0.7
  collection: ^1.19.1
  open_file: ^3.5.11


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  assets:
    - assets/.env
    - assets/app_icon.png
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/app_icon_foreground.png"
  min_sdk_android: 21
